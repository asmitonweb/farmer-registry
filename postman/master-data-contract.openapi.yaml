openapi: 3.0.3
info:
  title: Master Data attribute values used by OAN validation
  version: 1.0.0
  description: Bounded contract from the native MasterDataClient and MDS attribute controller.
paths:
  /attributes/get_attribute_values:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request_header, request_body]
              properties:
                request_header: {type: object}
                request_body:
                  type: object
                  required: [request_payload]
                  properties:
                    request_payload: {type: object}
                    pagination_request: {type: object}
      responses:
        '200':
          description: Native response envelope with scoped attribute values.
          content:
            application/json:
              example:
                response_header: {response_status: SUCCESS}
                response_body:
                  response_payload:
                    attribute_values:
                      - {attribute_id: GENDER, value_id: 10, value_code: MALE, value_display: Male}
                      - {attribute_id: LIVESTOCK_BREED, value_id: 42, value_code: LOCAL, value_display: Local}
                    total: 2
        '503':
          description: Master Data unavailable; submitted choices must be rejected.
