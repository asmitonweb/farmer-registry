# Simulation scaffold. Add fault-injection scenarios under each mock, e.g.:
#   scenarios:
#     - overrides:
#         conditions:
#           latency: { delay_ms: 500 }
# Then serve it with: postman simulation run <this file>

simulation: oan-master-data-validation
routing: path
mocks:
  - name: master-data
    routeKey: master-data
    path: ../mocks/master-data/config.yaml
  - name: master-data-unavailable
    routeKey: master-data-unavailable
    path: ../mocks/master-data-unavailable/config.yaml
  - name: master-data-malformed
    routeKey: master-data-malformed
    path: ../mocks/master-data-malformed/config.yaml
