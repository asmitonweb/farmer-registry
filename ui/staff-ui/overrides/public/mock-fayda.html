<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mock Fayda IDs | Farmer Registry</title>
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; background: #f6f2df; color: #1e1e1e; }
    body { margin: 0; padding: 32px 18px 56px; }
    main { max-width: 980px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; gap: 20px; align-items: start; margin-bottom: 24px; }
    h1 { margin: 0 0 8px; color: #e87512; font-size: 28px; }
    p { margin: 0; line-height: 1.5; }
    .note { background: #fff; border-left: 4px solid #e87512; border-radius: 8px; padding: 14px 16px; margin-bottom: 18px; }
    button { border: 0; border-radius: 7px; background: #eabf18; color: #111; cursor: pointer; font-weight: 700; padding: 10px 14px; }
    button:hover { background: #dcae00; }
    .status { min-height: 22px; color: #26733d; font-weight: 700; margin-bottom: 14px; }
    .list { display: grid; gap: 12px; }
    .card { background: #fff; border: 1px solid #e3d7b3; border-radius: 10px; padding: 16px; display: grid; grid-template-columns: 1fr auto; gap: 10px 16px; box-shadow: 0 2px 7px rgb(0 0 0 / 6%); }
    .card:first-child { border: 2px solid #e87512; }
    .id { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 20px; font-weight: 700; letter-spacing: .04em; }
    .name { font-size: 18px; font-weight: 700; margin-top: 4px; }
    .details { color: #555; font-size: 14px; grid-column: 1 / -1; }
    @media (max-width: 650px) { header { display: block; } .card { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Mock Fayda identities</h1>
      <p>Copy a Fayda ID, paste it into the Farmer intake identity section, then complete mock verification.</p>
    </div>
    <button id="reset-order" type="button">Reset order</button>
  </header>
  <div class="note"><strong>Local test data only.</strong> Copying an ID moves that identity to the top. An identity appears once; copying it again does not create a duplicate.</div>
  <div id="status" class="status" aria-live="polite"></div>
  <section id="list" class="list" aria-label="Mock Fayda identities"></section>
</main>
<script>
  const records = [
    { id: '100000000001', name: 'Abebe Kebede Tadesse', birthDate: '1988-04-12', gender: 'MALE' },
    { id: '100000000002', name: 'Almaz Desta Bekele', birthDate: '1992-09-23', gender: 'FEMALE' },
    { id: '100000000003', name: 'Dawit Mekonnen Hailu', birthDate: '1979-01-30', gender: 'MALE' },
    { id: '100000000004', name: 'Hana Tesfaye Girma', birthDate: '1996-06-08', gender: 'FEMALE' }
  ];
  const storageKey = 'oan.mock.fayda.order.v1';
  const list = document.getElementById('list');
  const status = document.getElementById('status');
  let order = loadOrder();

  function loadOrder() {
    try {
      const saved = JSON.parse(localStorage.getItem(storageKey) || '[]');
      return [...saved.filter(id => records.some(record => record.id === id)), ...records.map(record => record.id).filter(id => !saved.includes(id))];
    } catch { return records.map(record => record.id); }
  }

  function saveOrder() { localStorage.setItem(storageKey, JSON.stringify(order)); }

  async function copyId(id) {
    try {
      await navigator.clipboard.writeText(id);
    } catch {
      const input = document.createElement('input');
      input.value = id;
      document.body.appendChild(input);
      input.select();
      document.execCommand('copy');
      input.remove();
    }
    order = [id, ...order.filter(existingId => existingId !== id)];
    saveOrder();
    render();
    status.textContent = id + ' copied. Paste it into the Farmer intake form.';
  }

  function render() {
    list.replaceChildren(...order.map(id => {
      const record = records.find(item => item.id === id);
      const card = document.createElement('article');
      card.className = 'card';
      card.innerHTML = '<div><div class="id">' + record.id + '</div><div class="name">' + record.name + '</div></div>' +
        '<button type="button">Copy Fayda ID</button>' +
        '<div class="details">Birth date: ' + record.birthDate + ' · Gender: ' + record.gender + '</div>';
      card.querySelector('button').addEventListener('click', () => copyId(record.id));
      return card;
    }));
  }

  document.getElementById('reset-order').addEventListener('click', () => {
    order = records.map(record => record.id);
    saveOrder();
    status.textContent = 'Order reset.';
    render();
  });
  render();
</script>
</body>
</html>
